# Builds the provider JAR from a v* tag and publishes it as GitHub release (no deployment to Maven Central).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.24.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Maven build (incl. tests)
        run: ./mvnw -B -U clean verify
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" target/providers/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE
